services:
  db:
    image: postgres:16-alpine
    container_name: hivision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hivision}
      POSTGRES_USER: ${POSTGRES_USER:-hivision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hivision123}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hivision} -d ${POSTGRES_DB:-hivision}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hivision-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-hivision}
      DB_USER: ${POSTGRES_USER:-hivision}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hivision123}
    ports:
      - "${API_PORT:-3001}:3000"

volumes:
  pg_data:
